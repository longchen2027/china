port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true
  listen: "0.0.0.0:1053"
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: "arc"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
nameserver-policy:
  "geosite:cn":
     - "https://223.5.5.5/dns-query"
     - "https://doh.pub/dns-query"

proxies:
- name: vless-reality-vision-2027-clash
  type: vless
  server: 20.205.176.235
  port: 21399
  uuid: 62938565-c01b-49ea-b16a-69cf53c61965
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: apple.com
  reality-opts:
    public-key: asvPhOOMojm2J4MNQsi3feV5OCnCFuHqndccsmfEilA
    short-id: ba4727d8
  client-fingerprint: chrome

- name: vmess-ws-2027-clash
  type: vmess
  server: 20.205.176.235
  port: 2086
  uuid: 62938565-c01b-49ea-b16a-69cf53c61965
  alterId: 0
  cipher: auto
  udp: true
  tls: false
  network: ws
  servername: www.bing.com
  ws-opts:
    path: "62938565-c01b-49ea-b16a-69cf53c61965-vm"
    headers:
      Host: www.bing.com

- name: hysteria2-2027-clash
  type: hysteria2
  server: 20.205.176.235
  port: 25414
  ports:
  password: 62938565-c01b-49ea-b16a-69cf53c61965
  alpn:
    - h3
  sni: www.bing.com
  skip-cert-verify: true
  fast-open: true

- name: tuic5-2027-clash
  server: 20.205.176.235
  port: 30346
  type: tuic
  uuid: 62938565-c01b-49ea-b16a-69cf53c61965
  password: 62938565-c01b-49ea-b16a-69cf53c61965
  alpn: [h3]
  disable-sni: true
  reduce-rtt: true
  udp-relay-mode: native
  congestion-controller: bbr
  sni: www.bing.com
  skip-cert-verify: true

proxy-groups:
- name: 负载均衡
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 300
  strategy: round-robin
  proxies:
    - vless-reality-vision-2027-clash
    - vmess-ws-2027-clash
    - hysteria2-2027-clash
    - tuic5-2027-clash

- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
    - vless-reality-vision-2027-clash
    - vmess-ws-2027-clash
    - hysteria2-2027-clash
    - tuic5-2027-clash

- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡
    - 自动选择
    - DIRECT
    - vless-reality-vision-2027-clash
    - vmess-ws-2027-clash
    - hysteria2-2027-clash
    - tuic5-2027-clash

rules:
  - GEOIP,LAN,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
