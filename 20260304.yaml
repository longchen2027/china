port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true
  listen: "0.0.0.0:1053"
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: "arc"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
nameserver-policy:
  "geosite:cn":
     - "https://223.5.5.5/dns-query"
     - "https://doh.pub/dns-query"

proxies:
- name: vless-reality-vision-2028clash
  type: vless
  server: 52.139.216.151
  port: 30958
  uuid: d7d90ad9-eaff-4f7e-9ce5-12bd332994f4
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: apple.com
  reality-opts:
    public-key: 6D-5RGiKZPYfh7f38Mr466CAGAgTExETd55_ABZMqAM
    short-id: ff2066d4
  client-fingerprint: chrome

- name: vmess-ws-2028clash
  type: vmess
  server: 52.139.216.151
  port: 8080
  uuid: d7d90ad9-eaff-4f7e-9ce5-12bd332994f4
  alterId: 0
  cipher: auto
  udp: true
  tls: false
  network: ws
  servername: www.bing.com
  ws-opts:
    path: "d7d90ad9-eaff-4f7e-9ce5-12bd332994f4-vm"
    headers:
      Host: www.bing.com

- name: hysteria2-2028clash
  type: hysteria2
  server: 52.139.216.151
  port: 19281
  ports:
  password: d7d90ad9-eaff-4f7e-9ce5-12bd332994f4
  alpn:
    - h3
  sni: www.bing.com
  skip-cert-verify: true
  fast-open: true

- name: tuic5-2028clash
  server: 52.139.216.151
  port: 50921
  type: tuic
  uuid: d7d90ad9-eaff-4f7e-9ce5-12bd332994f4
  password: d7d90ad9-eaff-4f7e-9ce5-12bd332994f4
  alpn: [h3]
  disable-sni: true
  reduce-rtt: true
  udp-relay-mode: native
  congestion-controller: bbr
  sni: www.bing.com
  skip-cert-verify: true


proxy-groups:
- name: 负载均衡
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 300
  strategy: round-robin
  proxies:
    - vless-reality-vision-2028clash
    - vmess-ws-2028clash
    - hysteria2-2028clash
    - tuic5-2028clash


- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
    - vless-reality-vision-2028clash
    - vmess-ws-2028clash
    - hysteria2-2028clash
    - tuic5-2028clash
  
- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡
    - 自动选择
    - DIRECT
    - vless-reality-vision-2028clash
    - vmess-ws-2028clash
    - hysteria2-2028clash
    - tuic5-2028clash
   
rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点

